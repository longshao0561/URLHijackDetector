name: Build URLHijackDetector

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install iOS SDK
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path
    
    - name: Build dylib
      run: |
        make clean
        make
    
    - name: Verify build
      run: |
        file URLHijackDetector.dylib
        otool -L URLHijackDetector.dylib
        nm -gU URLHijackDetector.dylib
    
    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: URLHijackDetector
        path: |
          URLHijackDetector.dylib
          README.md
          inject.sh
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: URLHijackDetector.dylib
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
